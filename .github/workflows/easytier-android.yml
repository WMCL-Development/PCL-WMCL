name: easytier-android

# 交叉编译 Android arm64 的 EasyTier 产物：
#   - easytier-cli：NAT 检测（stun 子命令）用；额外提供 UPX 压缩版本
#   - libeasytier_ffi.so：启动器通过 C FFI 启动 EasyTier（tun fd 由 VpnService 注入）
# 构建完成后上传 strip 过的产物，本地下载后替换 NativeLibs 即可。

on:
  workflow_dispatch:
  push:
    branches: [dev, ci/easytier-android]
    paths:
      - '.github/workflows/easytier-android.yml'
      - '.github/easytier/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          path: self

      - name: 拉取 EasyTier 源码
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: v2.6.4
          path: EasyTier

      - name: 给 EasyTier 打补丁（STUN 服务器）
        run: python3 self/.github/easytier/patch-stun.py EasyTier

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config
          protoc --version

      - name: 安装 Android target
        run: |
          # EasyTier 仓库有 rust-toolchain.toml，必须在源码目录里加 target，否则会装到别的工具链上
          cd EasyTier
          rustup target add aarch64-linux-android
          rustup target list --installed | grep android
          rustc --version

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EasyTier/target
          key: easytier-android-${{ hashFiles('EasyTier/Cargo.lock') }}-v3

      - name: 交叉编译（CLI + FFI）
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android26"

          cd EasyTier
          echo "=== 构建 easytier-cli ==="
          cargo build --release --target aarch64-linux-android --bin easytier-cli 2>&1 | tee /tmp/cli.log

          echo "=== 构建 easytier-ffi ==="
          cargo build --release --target aarch64-linux-android -p easytier-ffi 2>&1 | tee /tmp/ffi.log

      - name: 裁剪（strip）
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          STRIP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cd EasyTier/target/aarch64-linux-android/release
          "$STRIP" --strip-all easytier-cli
          "$STRIP" --strip-all libeasytier_ffi.so
          ls -la easytier-cli libeasytier_ffi.so
          md5sum easytier-cli libeasytier_ffi.so

      - name: UPX 压缩 CLI
        run: |
          set -euo pipefail
          UPX_VERSION=4.2.4
          curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar xJf -
          ./upx-${UPX_VERSION}-amd64_linux/upx --lzma --best EasyTier/target/aarch64-linux-android/release/easytier-cli -o /tmp/easytier-cli-upx || true
          ls -la /tmp/easytier-cli-upx 2>/dev/null || true

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytier-build-log
          path: |
            /tmp/cli.log
            /tmp/ffi.log
          if-no-files-found: warn

      - name: 上传裁剪产物
        uses: actions/upload-artifact@v4
        with:
          name: easytier-android-arm64
          path: |
            EasyTier/target/aarch64-linux-android/release/easytier-cli
            EasyTier/target/aarch64-linux-android/release/libeasytier_ffi.so
            /tmp/easytier-cli-upx
          if-no-files-found: error
