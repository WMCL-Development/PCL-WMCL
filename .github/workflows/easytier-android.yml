name: easytier-android

# 交叉编译 EasyTier 的官方 Android JNI 模块，产出 libeasytier_android_jni.so。
# 手动触发或改动本文件时运行；失败时会把构建日志作为产物上传，便于排查。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/easytier-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 拉取 EasyTier 源码
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: v2.6.4
          path: EasyTier

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config
          protoc --version
          cmake --version | head -1

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EasyTier/target
          key: easytier-android-${{ hashFiles('EasyTier/Cargo.lock') }}

      - name: 编译 JNI 库（arm64-v8a）
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          echo "NDK=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" | head -5
          cd EasyTier/easytier-contrib/easytier-android-jni
          cargo ndk -t arm64-v8a build --release 2>&1 | tee /tmp/build.log

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libeasytier_android_jni-arm64
          path: EasyTier/target/aarch64-linux-android/release/libeasytier_android_jni.so
          if-no-files-found: error
