name: Android

on:
  workflow_dispatch:
  push:
    branches: [dev, sync/upstream]
    paths:
      - 'PCL.Launcher.Android/**'
      - 'PCL.Platform.Android/**'
      - 'PCL.Core/**'
      - 'PCL.Core.UI/**'
      - 'PCL.Launcher.Core/**'
      - 'PCL.Localization/**'
      - 'PCL.Platform/**'
      - 'PCL.Launcher/**'
      - 'scripts/fetch-easytier-android.sh'
      - '.github/workflows/android.yml'
      - '.github/workflows/reusable-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    uses: ./.github/workflows/reusable-android.yml
    with:
      configuration: Debug
      abi: universal
      version_code: ${{ 1000000 + github.run_number }}
    secrets: inherit
