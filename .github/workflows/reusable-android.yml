name: Build (Android Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      abi:
        required: true
        type: string
      version_name:
        required: false
        type: string
        default: ''
      version_code:
        required: false
        type: string
        default: ''
      version_suffix:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build android-${{ inputs.abi }}
    runs-on: ubuntu-latest
    env:
      VERSION_SUFFIX: ${{ inputs.version_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve version
        run: |
          if [ -n "${VERSION_SUFFIX:-}" ]; then
            python3 - "$VERSION_SUFFIX" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("PCL.Launcher/Resources/metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"]["suffix"] = sys.argv[1]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          CONFIG='${{ inputs.configuration }}'
          case "$CONFIG" in
            Beta) ANDROID_CONFIG=Release ;;
            *) ANDROID_CONFIG="$CONFIG" ;;
          esac

          VERSION_NAME='${{ inputs.version_name }}'
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(python3 -c "import json;print(json.load(open('PCL.Launcher/Resources/metadata.json'))['version']['base'])")
          fi

          VERSION_CODE='${{ inputs.version_code }}'
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=1000000
          fi

          echo "ANDROID_CONFIG=$ANDROID_CONFIG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "androidConfiguration=$ANDROID_CONFIG versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release.jks"

      - name: Cache EasyTier Android artifacts
        uses: actions/cache@v4
        with:
          path: PCL.Launcher.Android/NativeLibs
          key: easytier-android-${{ inputs.abi }}-wmcl-easytier-v2.6.4

      - name: Download EasyTier Android artifacts
        run: |
          case "${{ inputs.abi }}" in
            arm64)  bash scripts/fetch-easytier-android.sh arm64 ;;
            x86_64) bash scripts/fetch-easytier-android.sh x86_64 ;;
            *)      bash scripts/fetch-easytier-android.sh all ;;
          esac

      - name: Build desktop host
        env:
          PCL_WRITE_SECRET: '1'
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
        run: |
          dotnet build PCL.Launcher/PCL.Launcher.csproj             -c "$ANDROID_CONFIG" -p:UseSharedCompilation=false

      - name: Build signed APK
        env:
          PCL_WRITE_SECRET: '1'
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ABI='${{ inputs.abi }}'
          RID_ARG=""
          if [ "$ABI" != "universal" ]; then
            case "$ABI" in
              arm64) RID_ARG="-p:RuntimeIdentifier=android-arm64" ;;
              x86_64) RID_ARG="-p:RuntimeIdentifier=android-x64" ;;
              *) echo "unknown abi: $ABI" >&2; exit 2 ;;
            esac
          fi

          dotnet build PCL.Launcher.Android/PCL.Launcher.Android.csproj             -c "$ANDROID_CONFIG" -p:AndroidPackageFormat=apk -p:UseSharedCompilation=false             -p:ApplicationVersion="$VERSION_CODE"             -p:ApplicationDisplayVersion="$VERSION_NAME"             -p:AndroidKeyStore=true             -p:AndroidSigningKeyStore="$RUNNER_TEMP/android-signing/release.jks"             -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"             -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"             -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"             $RID_ARG

      - name: Collect and verify APK
        run: |
          ABI='${{ inputs.abi }}'
          APK=$(find PCL.Launcher.Android/bin -name '*-Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "signed APK not found" >&2
            exit 1
          fi
          OUT="PCL2_CE_${{ inputs.configuration }}_android_$ABI.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"*/ 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          fi
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCL2_CE_${{ inputs.configuration }}_android_${{ inputs.abi }}
          path: PCL2_CE_*_android_*.apk
          if-no-files-found: error
